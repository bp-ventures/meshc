{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Mesh Connect Sandbox - Withdraw</title>
  <link rel="icon" type="image/x-icon" href="{% static 'meshsbox/favicon.ico' %}">
  <link rel="icon" type="image/png" sizes="512x512" href="{% static 'meshsbox/favicon-512.png' %}">
  <link rel="apple-touch-icon" href="{% static 'meshsbox/favicon-512.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #fce4ec 0%, #f8bbd9 50%, #ce93d8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 2.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(255,255,255,0.5);
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      color: #6b7280;
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      transition: color 0.2s;
    }

    .nav-link:hover { color: #4f46e5; }

    .header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .header-icon {
      width: 40px;
      height: 40px;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #1a1a2e;
    }

    .subtitle {
      color: #6b7280;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: #374151;
      font-size: 0.9rem;
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 1.25rem;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #f9fafb;
      font-family: inherit;
      font-size: 0.9rem;
      color: #1f2937;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #ec4899;
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.1);
      background: white;
    }

    .input-with-copy input {
      padding-right: 3rem;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 0.8rem;
    }

    .copy-btn {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.25rem;
      color: #9ca3af;
      transition: color 0.2s;
    }

    .copy-btn:hover { color: #ec4899; }
    .copy-btn svg { width: 20px; height: 20px; }

    .exchange-select {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.625rem 1rem;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #f9fafb;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .exchange-select:focus-within {
      border-color: #ec4899;
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.1);
      background: white;
    }

    .exchange-icon { width: 28px; height: 28px; flex-shrink: 0; }
    .exchange-icon svg { width: 100%; height: 100%; }

    .exchange-select select {
      flex: 1;
      border: none;
      background: transparent;
      padding: 0.25rem 0;
      font-weight: 500;
    }

    .exchange-select select:focus {
      box-shadow: none;
    }

    .symbol-select {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.625rem 1rem;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #f9fafb;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .symbol-select:focus-within {
      border-color: #ec4899;
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.1);
      background: white;
    }

    .symbol-icon { width: 28px; height: 28px; flex-shrink: 0; }
    .symbol-icon svg { width: 100%; height: 100%; }

    .symbol-select select {
      flex: 1;
      border: none;
      background: transparent;
      padding: 0.25rem 0;
      font-weight: 500;
    }

    .symbol-select select:focus {
      box-shadow: none;
    }

    .submit-btn {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
      color: white;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px -5px rgba(236, 72, 153, 0.4);
    }

    .submit-btn:active { transform: translateY(0); }
    .submit-btn:disabled {
      background: #d1d5db;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .status {
      padding: 1rem;
      border-radius: 10px;
      margin-top: 1rem;
      font-size: 0.9rem;
      display: none;
    }

    .status.success { background: #d1fae5; color: #065f46; }
    .status.error { background: #fee2e2; color: #991b1b; }
    .status.loading { background: #fce7f3; color: #9d174d; }

    .results {
      margin-top: 1.5rem;
      display: none;
    }

    .results h3 {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 0.75rem;
    }

    .results pre {
      background: #1f2937;
      color: #e5e7eb;
      padding: 1rem;
      border-radius: 10px;
      overflow-x: auto;
      font-size: 0.75rem;
      font-family: 'SF Mono', Monaco, monospace;
      max-height: 300px;
    }

    .info-box {
      background: #fef3c7;
      border: 1px solid #fcd34d;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      color: #92400e;
    }

    .info-box strong {
      display: block;
      margin-bottom: 0.25rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <a href="{% url 'index' %}" class="nav-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      Back to Deposit
    </a>

    <div class="header">
      <img src="{% static 'meshsbox/favicon-512.png' %}" alt="Mesh" class="header-icon">
      <h1>Withdraw to Exchange</h1>
    </div>
    <p class="subtitle">Transfer from your wallet to your exchange account</p>

    <div class="info-box">
      <strong>Prerequisite:</strong>
      You must complete a deposit with "Easy Relogin" enabled first. This stores your exchange connection.
    </div>

    <form id="withdraw-form">
      <label>Your User ID</label>
      <div class="input-wrapper input-with-copy">
        <input type="text" name="user_id" value="GBXYIBA4JX4BMI4RGDI7XEKKTFIGM3AV5T7L7R2IN6L6QOWYDVKQA5NX" required>
        <button type="button" class="copy-btn" onclick="copyUserId()" title="Copy user ID">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
          </svg>
        </button>
      </div>

      <label>Destination Exchange</label>
      <div class="exchange-select">
        <span class="exchange-icon" id="exchange-icon"></span>
        <select name="exchange" id="exchange-dropdown">
          <option value="coinbase">Coinbase</option>
          <option value="binanceInternational">Binance</option>
        </select>
      </div>

      <label>Symbol</label>
      <div class="symbol-select">
        <span class="symbol-icon" id="symbol-icon"></span>
        <select name="symbol" id="symbol-dropdown">
          <option value="ETH" selected>ETH - Ethereum</option>
          <option value="USDC">USDC - USD Coin</option>
        </select>
      </div>

      <label>Amount (optional)</label>
      <div class="input-wrapper">
        <input type="number" name="amount" step="0.01" placeholder="0.1">
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">Withdraw to Exchange</button>
    </form>

    <div id="status" class="status"></div>

    <div class="results" id="results">
      <h3>Result</h3>
      <pre id="result-json"></pre>
    </div>
  </div>

  <script>
    function copyUserId() {
      const input = document.querySelector('input[name="user_id"]');
      navigator.clipboard.writeText(input.value);
      const btn = document.querySelector('.copy-btn');
      btn.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
      setTimeout(() => {
        btn.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>';
      }, 2000);
    }
  </script>

  <script type="module">
    const exchangeIcons = {
      coinbase: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="12" fill="#0052FF"/>
        <path d="M12 6C8.688 6 6 8.688 6 12C6 15.312 8.688 18 12 18C15.312 18 18 15.312 18 12C18 8.688 15.312 6 12 6ZM12 15.6C10.008 15.6 8.4 13.992 8.4 12C8.4 10.008 10.008 8.4 12 8.4C13.992 8.4 15.6 10.008 15.6 12C15.6 13.992 13.992 15.6 12 15.6Z" fill="white"/>
      </svg>`,
      binanceInternational: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="12" fill="#F3BA2F"/>
        <path d="M12 5L9.5 7.5L12 10L14.5 7.5L12 5Z" fill="#181A20"/>
        <path d="M7.5 9.5L5 12L7.5 14.5L10 12L7.5 9.5Z" fill="#181A20"/>
        <path d="M16.5 9.5L14 12L16.5 14.5L19 12L16.5 9.5Z" fill="#181A20"/>
        <path d="M12 14L9.5 16.5L12 19L14.5 16.5L12 14Z" fill="#181A20"/>
        <path d="M12 10.5L10.5 12L12 13.5L13.5 12L12 10.5Z" fill="#181A20"/>
      </svg>`
    };

    const tokenIcons = {
      ETH: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="12" fill="#627EEA"/>
        <path d="M12.0001 3V9.65073L17.6249 12.1661L12.0001 3Z" fill="white" fill-opacity="0.6"/>
        <path d="M11.9999 3L6.37512 12.1661L11.9999 9.65073V3Z" fill="white"/>
        <path d="M12.0001 16.477V20.9993L17.6249 13.2146L12.0001 16.477Z" fill="white" fill-opacity="0.6"/>
        <path d="M11.9999 20.9993V16.477L6.37512 13.2146L11.9999 20.9993Z" fill="white"/>
        <path d="M12.0001 15.4291L17.6249 12.1668L12.0001 9.65137V15.4291Z" fill="white" fill-opacity="0.2"/>
        <path d="M6.37512 12.1668L11.9999 15.4291V9.65137L6.37512 12.1668Z" fill="white" fill-opacity="0.6"/>
      </svg>`,
      USDC: `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 21C16.9706 21 21 16.9706 21 12C21 7.02943 16.9706 3 12 3C7.02943 3 3 7.02943 3 12C3 16.9706 7.02943 21 12 21Z" fill="#0B53BF"/>
        <path d="M13.6201 5.45V6.60874C15.9319 7.30624 17.625 9.45495 17.625 12.003C17.625 14.5511 15.9319 16.6999 13.6201 17.3973V18.5561C16.5675 17.8361 18.75 15.1755 18.75 12.003C18.75 8.83059 16.5675 6.16999 13.6201 5.45Z" fill="white"/>
        <path d="M6.37499 12.003C6.37499 9.45495 8.06809 7.30624 10.3799 6.60874V5.45C7.43247 6.16999 5.25 8.83059 5.25 12.003C5.25 15.1755 7.43247 17.8361 10.3799 18.5561V17.3973C8.06809 16.7055 6.37499 14.5511 6.37499 12.003Z" fill="white"/>
        <path d="M14.4188 13.2575C14.4188 10.9569 10.8132 11.9019 10.8132 10.6306C10.8132 10.175 11.1788 9.8825 11.8763 9.8825C12.7088 9.8825 12.9957 10.2875 13.0857 10.8331H14.2331C14.1308 9.80916 13.5431 9.16262 12.5626 8.97002V8.06565H11.4376V8.93774C10.3634 9.07454 9.6882 9.70009 9.6882 10.6306C9.6882 12.9425 13.2994 12.0762 13.2994 13.325C13.2994 13.7974 12.8438 14.1124 12.0732 14.1124C11.0663 14.1124 10.7344 13.6681 10.6107 13.055H9.49133C9.56385 14.1765 10.2554 14.8784 11.4376 15.0536V15.9405H12.5626V15.0654C13.7163 14.9164 14.4188 14.2452 14.4188 13.2575Z" fill="white"/>
      </svg>`
    };

    const exchangeSelect = document.getElementById('exchange-dropdown');
    const exchangeIcon = document.getElementById('exchange-icon');
    const symbolSelect = document.getElementById('symbol-dropdown');
    const symbolIcon = document.getElementById('symbol-icon');

    function updateExchangeIcon() {
      exchangeIcon.innerHTML = exchangeIcons[exchangeSelect.value] || '';
    }

    function updateSymbolIcon() {
      symbolIcon.innerHTML = tokenIcons[symbolSelect.value] || '';
    }

    exchangeSelect.addEventListener('change', updateExchangeIcon);
    symbolSelect.addEventListener('change', updateSymbolIcon);
    updateExchangeIcon();
    updateSymbolIcon();

    const form = document.getElementById('withdraw-form');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submit-btn');
    const resultsEl = document.getElementById('results');
    const resultJson = document.getElementById('result-json');
    const csrfToken = document.querySelector('meta[name="csrf-token"]').content;

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = `status ${type}`;
      statusEl.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      setStatus('Fetching exchange deposit address...', 'loading');

      const fd = new FormData(form);
      const payload = {
        user_id: fd.get('user_id'),
        exchange: fd.get('exchange'),
        symbol: fd.get('symbol'),
        amount: fd.get('amount') ? parseFloat(fd.get('amount')) : null,
      };

      try {
        const resp = await fetch('/meshc/api/withdraw-token/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken,
          },
          body: JSON.stringify(payload),
        });

        const data = await resp.json();

        if (!resp.ok) {
          throw new Error(data.error || 'API error');
        }

        setStatus('Opening Mesh Link...', 'loading');

        const { createLink } = await import('https://esm.sh/@meshconnect/web-link-sdk');

        const link = createLink({
          clientId: 'meshc-django',
          onIntegrationConnected: (p) => setStatus(`Connected wallet: ${p.brokerName}`, 'success'),
          onTransferFinished: async (p) => {
            setStatus(`Transfer ${p.status}`, p.status === 'success' ? 'success' : 'error');
            resultJson.textContent = JSON.stringify(p, null, 2);
            resultsEl.style.display = 'block';
            console.log('onTransferFinished payload:', JSON.stringify(p, null, 2));
          },
          onExit: (err) => {
            submitBtn.disabled = false;
            if (err) setStatus(`Error: ${err}`, 'error');
          },
        });

        // Show deposit address info
        if (data.deposit_address) {
          console.log('Deposit address:', data.deposit_address);
        }

        link.openLink(data.link_token);
      } catch (err) {
        setStatus(err.message, 'error');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
